name: Google Play Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track to upload to
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: Release status in Play Console
        required: true
        default: draft
        type: choice
        options:
          - draft
          - inProgress
          - halted
          - completed
  push:
    tags:
      - 'release'
      - 'v*'

permissions:
  contents: write

jobs:
  upload:
    name: Build signed AAB and upload to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Validate release target
        run: |
          TRACK="${{ github.event.inputs.track || 'internal' }}"
          STATUS="${{ github.event.inputs.status || 'draft' }}"
          if [ "$TRACK" = "production" ] && [ "$STATUS" = "completed" ]; then
            echo "Refusing to publish directly to production with completed status from this workflow." >&2
            echo "Use a draft/inProgress production upload or promote manually in Play Console." >&2
            exit 1
          fi

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 secret is required" >&2
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=../release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Test, lint, and build signed release APK and bundle
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease bundleRelease --no-daemon

      - name: Fail on Android lint errors
        run: |
          if grep -R "^[1-9][0-9]* errors" app/build/reports/lint-results-*.txt; then
            echo "Android lint reported errors. Fix them before release."
            exit 1
          fi

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Validate Play service-account JSON
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          node -e 'const value = process.env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; if (!value) process.exit(2); const parsed = JSON.parse(value); if (parsed.type !== "service_account" || !parsed.client_email || !parsed.private_key) process.exit(3); console.log("Play service-account JSON is valid.")'

      - name: Attach signed APK and AAB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kern ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.attachdesign.kern
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.status || 'draft' }}
