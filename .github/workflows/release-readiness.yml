name: Release Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, and package release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Test, lint, and package release APK
        run: ./gradlew testDebugUnitTest lint assembleRelease --no-daemon

      - name: Fail on Android lint errors
        run: |
          if grep -R "^[1-9][0-9]* errors" app/build/reports/lint-results-*.txt; then
            echo "Android lint reported errors. Fix them before release."
            exit 1
          fi

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*
          if-no-files-found: ignore

      - name: Upload release APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
