name: Android Build & Distribute

on:
  push:
    tags:
      - "test"
      - "release"

permissions:
  contents: write

jobs:
  build:
    name: Build & Distribute APK
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Bump version before building
      - name: Bump Version
        run: |
          current_version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          major=$(echo $current_version | cut -d. -f1)
          minor=$(echo $current_version | cut -d. -f2)
          patch=$(echo $current_version | cut -d. -f3)

          # Increment the patch version (force base 10 calculation)
          new_patch=$((10#$patch + 1))
          # Format to 3 digits
          new_patch_formatted=$(printf "%03d" $new_patch)

          new_version="${major}.${minor}.${new_patch_formatted}"

          # Replace the version in build.gradle.kts
          sed -i "s/versionName = \"$current_version\"/versionName = \"$new_version\"/" app/build.gradle.kts

          echo "Bumping version from $current_version to $new_version"

      - name: Commit and push version bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          # Only commit if there are changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: bump version [skip ci]"
            git push origin HEAD:${GITHUB_REF}
          else
            echo "No changes to commit"
          fi

      # Set up Java 17 (matches compileOptions in app/build.gradle.kts)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # Run unit tests to ensure stability before distributing
      - name: Run Unit Tests
        run: ./gradlew test

      # Build the Debug APK (signed automatically with standard debug keystore)
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # Upload the generated APK to Firebase App Distribution
      # This step will automatically email the testers in the specified group.
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_APP_DISTRIBUTION_CREDENTIALS }}
          groups: main-testers
          file: app/build/outputs/apk/debug/app-debug.apk
