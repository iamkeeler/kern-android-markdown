name: Android Build & Distribute

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Notes shown to Firebase testers
        required: false
        default: Branch test build
  push:
    tags:
      - "test"

permissions:
  contents: write

concurrency:
  group: android-app-distribution
  cancel-in-progress: false

jobs:
  build:
    name: Build & Distribute APK
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Set up Java 17 (matches compileOptions in app/build.gradle.kts)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # Restore Firebase config before any Gradle task configures the Google Services plugin
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 secret is required" >&2
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Test build versioning
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Reserve version and build number
        id: version
        run: python3 scripts/build_version.py reserve

      # Run unit tests to ensure stability before distributing
      - name: Test and build Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Verify packaged version
        run: python3 scripts/build_version.py verify-apk --apk app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release notes
        env:
          EXTRA_RELEASE_NOTES: ${{ github.event.inputs.release_notes || '' }}
        run: python3 scripts/prepare_release_notes.py

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kern-test-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/build-version.json
            build/release-notes.txt
          if-no-files-found: error

      # Extract Firebase App ID dynamically from google-services.json to prevent secret missing errors
      - name: Extract Firebase App ID
        run: |
          app_id=$(grep '"mobilesdk_app_id"' app/google-services.json | head -n 1 | cut -d'"' -f4)
          echo "FIREBASE_APP_ID=$app_id" >> "$GITHUB_ENV"

      # Upload the generated APK to Firebase App Distribution
      # This step will automatically email the testers in the specified group.
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_APP_DISTRIBUTION_CREDENTIALS }}
          groups: main-testers
          file: app/build/outputs/apk/debug/app-debug.apk
          releaseNotesFile: build/release-notes.txt

      - name: Attach debug APK to test prerelease
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: Kern test build
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body_path: build/release-notes.txt
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/debug/app-debug.apk
