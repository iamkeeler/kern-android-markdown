name: Android Build & Distribute

on:
  push:
    tags:
      - "test"

permissions:
  contents: write

jobs:
  build:
    name: Build & Distribute APK
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Bump version before building
      - name: Bump Version
        run: |
          major=$(grep 'version.major=' gradle.properties | cut -d= -f2)
          minor=$(grep 'version.minor=' gradle.properties | cut -d= -f2)
          patch=$(grep 'version.patch=' gradle.properties | cut -d= -f2)
          code=$(grep 'version.code=' gradle.properties | cut -d= -f2)

          new_patch=$((10#$patch + 1))
          new_code=$((10#$code + 1))

          sed -i "s/version.patch=$patch/version.patch=$new_patch/" gradle.properties
          sed -i "s/version.code=$code/version.code=$new_code/" gradle.properties

          echo "Bumping version from ${major}.${minor}.${patch} (code $code) to ${major}.${minor}.${new_patch} (code $new_code)"

      - name: Commit and push version bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          # Only commit if there are changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: bump version [skip ci]"
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              # Push to main. If non-fast-forward, fetch main, rebase the bump, and push again.
              git push origin HEAD:refs/heads/main || {
                echo "Push failed. Fetching latest main and rebasing version bump..."
                git fetch origin main
                git rebase origin/main
                git push origin HEAD:refs/heads/main
              }
            else
              git push origin HEAD:${GITHUB_REF}
            fi
          else
            echo "No changes to commit"
          fi

      # Set up Java 17 (matches compileOptions in app/build.gradle.kts)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # Restore Firebase config before any Gradle task configures the Google Services plugin
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 secret is required" >&2
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      # Run unit tests to ensure stability before distributing
      - name: Test and build Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      # Extract Firebase App ID dynamically from google-services.json to prevent secret missing errors
      - name: Extract Firebase App ID
        run: |
          app_id=$(grep '"mobilesdk_app_id"' app/google-services.json | head -n 1 | cut -d'"' -f4)
          echo "FIREBASE_APP_ID=$app_id" >> $GITHUB_ENV

      # Upload the generated APK to Firebase App Distribution
      # This step will automatically email the testers in the specified group.
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_APP_DISTRIBUTION_CREDENTIALS }}
          groups: main-testers
          file: app/build/outputs/apk/debug/app-debug.apk
